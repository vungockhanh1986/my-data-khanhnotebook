<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codebase Graph — my-data-khanhnotebook</title>
    <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #161b22 0%, #1a2332 100%);
            border-bottom: 1px solid #30363d;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.5em;
        }
        .header .subtitle {
            color: #8b949e;
            font-size: 0.9em;
            margin-top: 4px;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
        }
        .stat {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 16px;
            text-align: center;
        }
        .stat .value {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: bold;
        }
        .stat .label {
            color: #8b949e;
            font-size: 0.75em;
            text-transform: uppercase;
        }
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 16px;
        }
        .chart-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
        }
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        .chart-card h3 {
            color: #c9d1d9;
            font-size: 0.95em;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
        }
        .chart-container {
            width: 100%;
        }
        #graph3d { height: 500px; }
        #treemap { height: 350px; }
        #file-bar { height: 300px; }
        #edge-graph { height: 400px; }
        .footer {
            text-align: center;
            padding: 20px;
            color: #484f58;
            font-size: 0.8em;
            border-top: 1px solid #21262d;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🔗 my-data-khanhnotebook — Codebase Graph</h1>
            <div class="subtitle">Cấu trúc repository &amp; quan hệ giữa các file</div>
        </div>
        <div class="stats-bar">
            <div class="stat">
                <div class="value">4</div>
                <div class="label">Files</div>
            </div>
            <div class="stat">
                <div class="value">2</div>
                <div class="label">Modules</div>
            </div>
            <div class="stat">
                <div class="value">13</div>
                <div class="label">Nodes</div>
            </div>
            <div class="stat">
                <div class="value">13</div>
                <div class="label">Edges</div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="chart-card full-width">
            <h3>🌐 3D Interactive File Graph</h3>
            <div id="graph3d" class="chart-container"></div>
        </div>
        <div class="chart-card">
            <h3>📊 Module Treemap</h3>
            <div id="treemap" class="chart-container"></div>
        </div>
        <div class="chart-card">
            <h3>📁 File Structure</h3>
            <div id="file-bar" class="chart-container"></div>
        </div>
        <div class="chart-card full-width">
            <h3>🔀 Dependency / Relationship Graph</h3>
            <div id="edge-graph" class="chart-container"></div>
        </div>
    </div>

    <div class="footer">
        Generated by Hermes Codebase Graph Visualizer • my-data-khanhnotebook
    </div>

    <script>
    // ===== Data =====
    const files = [
        { name: 'index.html', size: 1286, type: 'HTML', lines: 33, color: '#e34c26' },
        { name: 'plotly_chart.html', size: 147218, type: 'HTML', lines: 10, color: '#e34c26' },
        { name: 'logbook.md', size: 1769472, type: 'Markdown', lines: 45, color: '#083fa1' },
        { name: 'README.md', size: 2048, type: 'Markdown', lines: 15, color: '#083fa1' },
        { name: 'CNAME', size: 20, type: 'Config', lines: 1, color: '#555555' },
        { name: 'video1.mp4', size: 5242880, type: 'Video', lines: 0, color: '#ff6b6b' }
    ];

    const modules = [
        { name: 'index', files: 1, color: '#58a6ff' },
        { name: 'plotly_chart', files: 1, color: '#7c3aed' },
        { name: 'logbook', files: 1, color: '#f0883e' },
        { name: 'README', files: 1, color: '#3fb950' }
    ];

    // Edges: relationships between files
    const edges = [
        { source: 'index.html', target: 'plotly_chart.html', type: 'iframe_embed' },
        { source: 'index.html', target: 'video1.mp4', type: 'video_ref' },
        { source: 'README.md', target: 'index.html', type: 'docs_of' },
        { source: 'README.md', target: 'logbook.md', type: 'docs_of' },
        { source: 'CNAME', target: 'index.html', type: 'serves' }
    ];

    // ===== 3D Scatter Graph =====
    const nodes3d = files.map((f, i) => ({
        x: Math.cos(i * 2.1) * (f.size / 500000),
        y: Math.sin(i * 2.1) * (f.size / 500000),
        z: f.lines * 2,
        name: f.name,
        size: Math.max(8, Math.min(40, Math.sqrt(f.size) / 100)),
        color: f.color,
        text: `${f.name}<br>Size: ${(f.size/1024).toFixed(1)} KB<br>Lines: f.lines}<br>Type: ${f.type}`
    }));

    const edgeTraces = edges.map(e => {
        const src = files.findIndex(f => f.name === e.source);
        const tgt = files.findIndex(f => f.name === e.target);
        if (src < 0 || tgt < 0) return null;
        const n1 = nodes3d[src], n2 = nodes3d[tgt];
        return {
            x: [n1.x, n2.x, null],
            y: [n1.y, n2.y, null],
            z: [n1.z, n2.z, null],
            mode: 'lines',
            line: { color: '#30363d', width: 1.5, dash: 'dot' },
            hoverinfo: 'none',
            type: 'scatter3d',
            showlegend: false
        };
    }).filter(Boolean);

    Plotly.newPlot('graph3d', [
        ...edgeTraces,
        {
            x: nodes3d.map(n => n.x),
            y: nodes3d.map(n => n.y),
            z: nodes3d.map(n => n.z),
            mode: 'markers+text',
            type: 'scatter3d',
            text: nodes3d.map(n => n.name),
            textposition: 'top center',
            textfont: { size: 10, color: '#c9d1d9' },
            marker: {
                size: nodes3d.map(n => n.size),
                color: nodes3d.map(n => n.color),
                opacity: 0.85,
                line: { color: '#0d1117', width: 1 }
            },
            hovertext: nodes3d.map(n => n.text),
            hoverinfo: 'text',
            showlegend: false
        }
    ], {
        paper_bgcolor: '#161b22',
        plot_bgcolor: '#161b22',
        margin: { l: 0, r: 0, t: 0, b: 0 },
        scene: {
            xaxis: { showgrid: false, zeroline: false, showticklabels: false, title: { text: '' } },
            yaxis: { showgrid: false, zeroline: false, showticklabels: false, title: { text: '' } },
            zaxis: { showgrid: false, zeroline: false, showticklabels: false, title: { text: '' } },
            bgcolor: '#161b22'
        },
        hoverlabel: { bgcolor: '#21262d', bordercolor: '#30363d', font: { color: '#c9d1d9' } }
    }, { responsive: true });

    // ===== Treemap =====
    Plotly.newPlot('treemap', [{
        type: 'treemap',
        labels: ['my-data-khanhnotebook', 'index.html', 'plotly_chart.html', 'logbook.md', 'README.md', 'CNAME', 'video1.mp4'],
        parents: ['', 'my-data-khanhnotebook', 'my-data-khanhnotebook', 'my-data-khanhnotebook', 'my-data-khanhnotebook', 'my-data-khanhnotebook', 'my-data-khanhnotebook'],
        values: [0, 1286, 147218, 1769472, 2048, 20, 5242880],
        textinfo: 'label+value',
        marker: {
            colors: ['#161b22', '#e34c26', '#7c3aed', '#083fa1', '#3fb950', '#555555', '#ff6b6b']
        },
        textfont: { color: '#0d1117', size: 12 },
        hovertemplate: '<b>%{label}</b><br>Size: %{value:,} bytes<extra></extra>'
    }], {
        paper_bgcolor: '#161b22',
        plot_bgcolor: '#161b22',
        margin: { l: 10, r: 10, t: 10, b: 10 },
        font: { color: '#0d1117' }
    }, { responsive: true });

    // ===== File Bar Chart =====
    Plotly.newPlot('file-bar', [{
        x: files.filter(f => f.lines > 0).map(f => f.name),
        y: files.filter(f => f.lines > 0).map(f => f.lines),
        type: 'bar',
        marker: {
            color: files.filter(f => f.lines > 0).map(f => f.color),
            opacity: 0.85,
            line: { color: '#0d1117', width: 1 }
        },
        text: files.filter(f => f.lines > 0).map(f => f.lines + ' lines'),
        textposition: 'outside',
        textfont: { color: '#c9d1d9', size: 11 },
        hovertemplate: '<b>%{x}</b><br>Lines: %{y}<extra></extra>'
    }], {
        paper_bgcolor: '#161b22',
        plot_bgcolor: '#161b22',
        margin: { l: 50, r: 20, t: 30, b: 50 },
        xaxis: { tickfont: { color: '#8b949e' }, gridcolor: '#21262d' },
        yaxis: { tickfont: { color: '#8b949e' }, gridcolor: '#21262d', title: { text: 'Lines of Code', font: { color: '#8b949e' } } },
        bargap: 0.4
    }, { responsive: true });

    // ===== Edge / Relationship Graph (2D) =====
    const fileNames = files.map(f => f.name);
    const positions = {};
    fileNames.forEach((name, i) => {
        const angle = (i / fileNames.length) * 2 * Math.PI;
        positions[name] = {
            x: Math.cos(angle) * 3,
            y: Math.sin(angle) * 3
        };
    });

    const edgeLines = edges.map(e => {
        const p1 = positions[e.source];
        const p2 = positions[e.target];
        if (!p1 || !p2) return null;
        return {
            x: [p1.x, p2.x, null],
            y: [p1.y, p2.y, null],
            mode: 'lines',
            line: { color: '#58a6ff', width: 2, dash: 'dot' },
            hoverinfo: 'text',
            hovertext: `${e.source} → ${e.target} (${e.type})`,
            showlegend: false
        };
    }).filter(Boolean);

    Plotly.newPlot('edge-graph', [
        ...edgeLines,
        {
            x: fileNames.map(n => positions[n].x),
            y: fileNames.map(n => positions[n].y),
            mode: 'markers+text',
            text: fileNames,
            textposition: 'top center',
            textfont: { size: 11, color: '#c9d1d9' },
            marker: {
                size: files.map(f => Math.max(15, Math.min(50, Math.sqrt(f.size) / 80))),
                color: files.map(f => f.color),
                opacity: 0.9,
                line: { color: '#0d1117', width: 2 }
            },
            hovertext: files.map(f => `<b>${f.name}</b><br>Type: ${f.type}<br>Size: ${(f.size/1024).toFixed(1)} KB<br>Lines: ${f.lines}`),
            hoverinfo: 'text',
            showlegend: false
        }
    ], {
        paper_bgcolor: '#161b22',
        plot_bgcolor: '#161b22',
        margin: { l: 60, r: 60, t: 60, b: 60 },
        xaxis: { showgrid: false, zeroline: false, showticklabels: false },
        yaxis: { showgrid: false, zeroline: false, showticklabels: false },
        hoverlabel: { bgcolor: '#21262d', bordercolor: '#58a6ff', font: { color: '#c9d1d9' } }
    }, { responsive: true });
    </script>
</body>
</html>
